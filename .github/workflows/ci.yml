name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint, Format, and E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      minio:
        image: minio/minio:RELEASE
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
          - 9001:9001
        # Avoid fragile container-side healthcheck; runner will wait for MinIO using mc
        command: server /data --console-address ":9001"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare MinIO (bucket + fixture object)
        run: |
          # Install mc (MinIO client)
          wget -q https://dl.min.io/client/mc/release/linux-amd64/mc -O mc
          chmod +x mc
          sudo mv mc /usr/local/bin/

          # Wait for MinIO to respond, then configure alias
          until mc --insecure alias set myminio http://localhost:9000 minioadmin minioadmin --api S3v4 >/dev/null 2>&1; do
            echo "Waiting for MinIO..."
            sleep 1
          done

          # Create bucket that matches S3_BUCKET_NAME used by the app
          mc --insecure mb --ignore-existing myminio/downloads

          # Upload fixture expected by the server tests (bucket root: downloads/70000.zip)
          echo "fixture" > 70000.zip
          mc --insecure cp 70000.zip myminio/downloads/70000.zip

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run E2E tests (capture logs)
        env:
          CI: "true"
          NODE_ENV: development
          PORT: "3000"

          # S3 -> MinIO (point tests at service exposed on localhost)
          S3_REGION: "us-east-1"
          S3_ENDPOINT: "http://localhost:9000"
          S3_BUCKET_NAME: "downloads"
          S3_ACCESS_KEY_ID: "minioadmin"
          S3_SECRET_ACCESS_KEY: "minioadmin"
          S3_FORCE_PATH_STYLE: "true"

          # Keep stable in CI
          SENTRY_DSN: ""
          OTEL_EXPORTER_OTLP_ENDPOINT: ""
          REQUEST_TIMEOUT_MS: "30000"
          RATE_LIMIT_WINDOW_MS: "60000"
          RATE_LIMIT_MAX_REQUESTS: "100"
          CORS_ORIGINS: "*"

          # Disable random long delays in CI (important for stable tests)
          DOWNLOAD_DELAY_ENABLED: "false"
          DOWNLOAD_DELAY_MIN_MS: "0"
          DOWNLOAD_DELAY_MAX_MS: "0"
        run: |
          set -o pipefail
          mkdir -p test-results
          # Ensure there's always a log to upload later
          : > test-results/e2e.log
          npm run test:e2e 2>&1 | tee -a test-results/e2e.log
        timeout-minutes: 25

      - name: Ensure test log exists
        if: always()
        run: |
          mkdir -p test-results
          [ -f test-results/e2e.log ] || echo "No test output" > test-results/e2e.log

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: test-results/e2e.log

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: lint-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR (only on pushes to main/master)
        if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and optionally push) Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max